<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SILARAS | Sistem Informasi Laboratorium Siliwangi - Fakultas Pertanian UNSIL</title>
  <link rel="icon" type="image/png" href="https://drive.google.com/thumbnail?id=1LIq-IYBi0L6lXGEMDyrb3jmVjf9yAQRU&sz=w128" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./assets/css/app.css" />
</head>
<body class="bg-slate-50 text-slate-800 antialiased" x-data="silarasApp" x-init="initApp()">

  <!-- Global Toast Notification -->
  <div x-show="toast.show" x-cloak x-transition class="fixed top-5 right-5 z-[90] max-w-sm">
    <div :class="toast.type === 'error' ? 'bg-red-600' : (toast.type === 'warn' ? 'bg-amber-600' : 'bg-emerald-700')" class="text-white px-4 py-3 rounded-xl shadow-xl flex items-start gap-3 text-sm">
      <i class="fa-solid mt-0.5" :class="toast.type === 'error' ? 'fa-circle-exclamation' : 'fa-circle-check'"></i>
      <div class="flex-1" x-text="toast.message"></div>
      <button @click="toast.show = false" class="text-white/80 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
    </div>
  </div>

  <!-- Global Loading Overlay -->
  <div x-show="loading" x-cloak class="fixed inset-0 bg-slate-900/40 backdrop-blur-[1px] z-[80] flex items-center justify-center">
    <div class="bg-white px-6 py-4 rounded-2xl shadow-xl flex items-center gap-3">
      <i class="fa-solid fa-circle-notch fa-spin text-emerald-700 text-xl"></i>
      <span class="text-sm font-medium text-slate-700" x-text="loadingText || 'Memuat data...'"></span>
    </div>
  </div>

  <!-- ==================== PUBLIC HOME VIEW ==================== -->
  <template x-if="!session">
    <div class="min-h-screen flex flex-col">
      <!-- Navbar Publik -->
      <header class="bg-silaras-dark text-white sticky top-0 z-40 shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
          <div class="flex items-center gap-3">
            <img src="https://drive.google.com/thumbnail?id=1LIq-IYBi0L6lXGEMDyrb3jmVjf9yAQRU&sz=w128" alt="Logo SILARAS" class="w-10 h-10 rounded-xl bg-white p-1 object-contain shadow-sm" />
            <div>
              <div class="font-bold tracking-tight text-lg leading-tight">SILARAS</div>
              <div class="text-[11px] text-emerald-200 leading-tight">Fakultas Pertanian &bull; Universitas Siliwangi</div>
            </div>
          </div>
          <div class="flex items-center gap-2 sm:gap-3">
            <button @click="openAuthModal('login')" class="px-3.5 py-2 rounded-lg text-sm font-medium text-emerald-100 hover:bg-emerald-800 transition">
              <i class="fa-solid fa-right-to-bracket mr-1.5"></i>Masuk
            </button>
            <button @click="openAuthModal('register')" class="px-4 py-2 rounded-lg text-sm font-semibold bg-silaras-lime text-slate-900 hover:bg-lime-400 transition shadow-sm">
              <i class="fa-solid fa-user-plus mr-1.5"></i>Daftar Akun
            </button>
          </div>
        </div>
      </header>

      <!-- Hero Banner -->
      <section class="bg-gradient-to-br from-[#064E3B] via-[#065F46] to-[#047857] text-white py-12 sm:py-16">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 grid lg:grid-cols-12 gap-8 items-center">
          <div class="lg:col-span-7 space-y-4">
            <span class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-white/10 text-lime-300 text-xs font-semibold">
              <i class="fa-solid fa-seedling"></i> Sistem Informasi Laboratorium Siliwangi
            </span>
            <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight leading-tight">
              Layanan Terpadu Peralatan, Bahan &amp; Jadwal Ruang Laboratorium
            </h1>
            <p class="text-emerald-100 text-sm sm:text-base max-w-2xl leading-relaxed">
              Pantau ketersediaan inventaris peralatan, bahan praktikum, bahan kimia, serta agenda penggunaan ruang laboratorium secara real-time tanpa perlu login. Masuk untuk mengajukan peminjaman dan penggunaan fasilitas.
            </p>
            <div class="pt-2 flex flex-wrap gap-3">
              <a href="#katalog-publik" class="px-5 py-2.5 rounded-xl bg-silaras-lime text-slate-900 font-semibold text-sm hover:bg-lime-400 transition">
                Lihat Ketersediaan Alat &amp; Bahan
              </a>
              <a href="#jadwal-publik" class="px-5 py-2.5 rounded-xl bg-white/10 hover:bg-white/20 text-white font-medium text-sm transition">
                Cek Jadwal Ruang Lab
              </a>
            </div>
          </div>
          <div class="lg:col-span-5 grid grid-cols-2 gap-3 sm:gap-4">
            <div class="bg-white/10 backdrop-blur-sm border border-white/15 rounded-2xl p-4">
              <div class="text-lime-300 text-xs font-semibold uppercase">Peralatan Lab</div>
              <div class="text-2xl sm:text-3xl font-extrabold mt-1" x-text="publicSummary.totalTools">0</div>
              <div class="text-xs text-emerald-100 mt-1">Unit terdaftar di katalog</div>
            </div>
            <div class="bg-white/10 backdrop-blur-sm border border-white/15 rounded-2xl p-4">
              <div class="text-lime-300 text-xs font-semibold uppercase">Bahan &amp; Kimia</div>
              <div class="text-2xl sm:text-3xl font-extrabold mt-1" x-text="publicSummary.totalMaterials">0</div>
              <div class="text-xs text-emerald-100 mt-1">Item bahan tersedia</div>
            </div>
            <div class="bg-white/10 backdrop-blur-sm border border-white/15 rounded-2xl p-4">
              <div class="text-lime-300 text-xs font-semibold uppercase">Laboratorium</div>
              <div class="text-2xl sm:text-3xl font-extrabold mt-1" x-text="publicLabs.length">0</div>
              <div class="text-xs text-emerald-100 mt-1">Unit lab Fakultas Pertanian</div>
            </div>
            <div class="bg-white/10 backdrop-blur-sm border border-white/15 rounded-2xl p-4">
              <div class="text-lime-300 text-xs font-semibold uppercase">Agenda Terjadwal</div>
              <div class="text-2xl sm:text-3xl font-extrabold mt-1" x-text="publicSchedule.length">0</div>
              <div class="text-xs text-emerald-100 mt-1">Praktikum &amp; penelitian</div>
            </div>
          </div>
        </div>
      </section>

      <!-- Katalog Publik -->
      <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-10 space-y-12">
        <section id="katalog-publik" class="space-y-4">
          <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
              <h2 class="text-xl font-bold text-slate-900">Katalog Ketersediaan Alat &amp; Bahan</h2>
              <p class="text-sm text-slate-500">Data inventaris terkini dari seluruh laboratorium Fakultas Pertanian.</p>
            </div>
            <div class="flex flex-wrap items-center gap-2">
              <select x-model="publicFilter.lab_id" class="px-3 py-2 bg-white border border-slate-300 rounded-xl text-sm">
                <option value="">Semua Laboratorium</option>
                <template x-for="lab in publicLabs" :key="lab.lab_id">
                  <option :value="lab.lab_id" x-text="lab.lab_name"></option>
                </template>
              </select>
              <select x-model="publicFilter.category" class="px-3 py-2 bg-white border border-slate-300 rounded-xl text-sm">
                <option value="">Semua Kategori</option>
                <option value="Alat">Peralatan</option>
                <option value="Bahan">Bahan</option>
                <option value="Bahan Kimia">Bahan Kimia</option>
              </select>
              <input type="text" x-model="publicFilter.search" placeholder="Cari nama alat/bahan..." class="px-3 py-2 bg-white border border-slate-300 rounded-xl text-sm w-56" />
            </div>
          </div>

          <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
              <table class="w-full text-sm text-left">
                <thead class="bg-slate-50 text-slate-600 font-semibold border-b border-slate-200">
                  <tr>
                    <th class="px-4 py-3 w-16">Foto</th>
                    <th class="px-4 py-3">Nama Item</th>
                    <th class="px-4 py-3">Kategori</th>
                    <th class="px-4 py-3">Laboratorium</th>
                    <th class="px-4 py-3">Merk / Spesifikasi</th>
                    <th class="px-4 py-3 text-right">Tersedia</th>
                    <th class="px-4 py-3">Status</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                  <template x-for="item in paginatedPublicCatalog" :key="item.inv_id">
                    <tr class="hover:bg-slate-50/80">
                      <td class="px-4 py-3">
                        <template x-if="item.photo_url">
                          <img :src="normalizeDriveImgUrl(item.photo_url)" @click="openImagePreview(item.photo_url, item.item_name)" class="w-11 h-11 rounded-lg object-cover border border-slate-200 cursor-pointer hover:opacity-80" />
                        </template>
                        <template x-if="!item.photo_url">
                          <div class="w-11 h-11 rounded-lg bg-slate-100 text-slate-400 flex items-center justify-center text-xs"><i class="fa-solid fa-image"></i></div>
                        </template>
                      </td>
                      <td class="px-4 py-3 font-medium text-slate-900" x-text="item.item_name"></td>
                      <td class="px-4 py-3">
                        <span class="px-2.5 py-0.5 rounded-full text-xs font-medium"
                              :class="item.category === 'Alat' ? 'bg-blue-50 text-blue-700' : (item.category === 'Bahan Kimia' ? 'bg-purple-50 text-purple-700' : 'bg-amber-50 text-amber-700')"
                              x-text="item.category"></span>
                      </td>
                      <td class="px-4 py-3 text-slate-600" x-text="item.lab_name"></td>
                      <td class="px-4 py-3 text-slate-500 text-xs" x-text="(item.brand || '-') + (item.spec ? ' • ' + item.spec : '')"></td>
                      <td class="px-4 py-3 text-right font-semibold text-slate-800" x-text="item.qty_available + ' ' + item.unit"></td>
                      <td class="px-4 py-3">
                        <span class="px-2.5 py-0.5 rounded-full text-xs font-semibold"
                              :class="item.qty_available > 0 ? 'bg-emerald-50 text-emerald-700' : 'bg-red-50 text-red-700'"
                              x-text="item.qty_available > 0 ? 'Tersedia' : 'Kosong'"></span>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
            <!-- Pagination -->
            <div x-show="filteredPublicCatalog.length > 0" class="px-4 py-3 bg-slate-50 border-t border-slate-200 flex items-center justify-between text-xs text-slate-600">
              <div>Menampilkan <span class="font-semibold" x-text="publicPageStart"></span>–<span class="font-semibold" x-text="publicPageEnd"></span> dari <span class="font-semibold" x-text="filteredPublicCatalog.length"></span> item</div>
              <div class="flex items-center gap-1">
                <button @click="publicCatalogPage = Math.max(1, publicCatalogPage - 1)" :disabled="publicCatalogPage <= 1" class="px-2.5 py-1.5 rounded-lg border border-slate-300 bg-white disabled:opacity-40"><i class="fa-solid fa-chevron-left"></i></button>
                <span class="px-3 py-1 font-medium">Hal <span x-text="publicCatalogPage"></span> / <span x-text="publicCatalogTotalPages"></span></span>
                <button @click="publicCatalogPage = Math.min(publicCatalogTotalPages, publicCatalogPage + 1)" :disabled="publicCatalogPage >= publicCatalogTotalPages" class="px-2.5 py-1.5 rounded-lg border border-slate-300 bg-white disabled:opacity-40"><i class="fa-solid fa-chevron-right"></i></button>
              </div>
            </div>
          </div>
        </section>

        <!-- Jadwal Publik -->
        <section id="jadwal-publik" class="space-y-4">
          <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
              <h2 class="text-xl font-bold text-slate-900">Jadwal Penggunaan Ruangan Laboratorium</h2>
              <p class="text-sm text-slate-500">Agenda praktikum dan penelitian yang telah disetujui.</p>
            </div>
            <div class="flex items-center gap-2">
              <div class="inline-flex rounded-xl bg-slate-200 p-1 text-xs font-semibold">
                <button @click="publicScheduleView = 'list'" :class="publicScheduleView === 'list' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600'" class="px-3 py-1.5 rounded-lg transition">Daftar</button>
                <button @click="publicScheduleView = 'calendar'" :class="publicScheduleView === 'calendar' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600'" class="px-3 py-1.5 rounded-lg transition">Kalender</button>
              </div>
            </div>
          </div>
          <div x-show="publicScheduleView === 'list'" class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <table class="w-full text-sm text-left">
              <thead class="bg-slate-50 text-slate-600 font-semibold border-b border-slate-200">
                <tr>
                  <th class="px-4 py-3">Tanggal</th>
                  <th class="px-4 py-3">Jam</th>
                  <th class="px-4 py-3">Laboratorium</th>
                  <th class="px-4 py-3">Kegiatan</th>
                  <th class="px-4 py-3">Penanggung Jawab</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-100">
                <template x-for="s in filteredPublicSchedule" :key="s.booking_id">
                  <tr>
                    <td class="px-4 py-3 font-medium" x-text="formatDateIndonesian(s.booking_date)"></td>
                    <td class="px-4 py-3 font-mono text-xs" x-text="s.start_time + ' - ' + s.end_time"></td>
                    <td class="px-4 py-3 font-medium text-emerald-800" x-text="s.lab_name"></td>
                    <td class="px-4 py-3" x-text="s.activity_title"></td>
                    <td class="px-4 py-3 text-slate-600" x-text="s.pic_name"></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </section>
      </main>

      <footer class="bg-slate-900 text-slate-400 text-xs py-6 text-center">
        &copy; 2026 SILARAS &mdash; Fakultas Pertanian Universitas Siliwangi.
      </footer>
    </div>
  </template>

  <!-- ==================== AUTH MODAL (LOGIN / REGISTER / FORGOT) ==================== -->
  <div x-show="authModal.open && !session" x-cloak class="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl relative" @click.away="authModal.open = false">
      <button @click="authModal.open = false" class="absolute top-4 right-4 text-slate-400 hover:text-slate-700"><i class="fa-solid fa-xmark text-lg"></i></button>
      
      <!-- Login Form -->
      <div x-show="authModal.mode === 'login'" class="space-y-4">
        <h3 class="text-xl font-bold text-slate-900">Masuk ke SILARAS</h3>
        <form @submit.prevent="submitLogin()" class="space-y-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Email</label>
            <input type="email" required x-model="loginForm.email" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Kata Sandi</label>
            <input type="password" required x-model="loginForm.password" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm" />
          </div>
          <div class="text-right">
            <button type="button" @click="switchAuthMode('forgot')" class="text-xs text-emerald-700 hover:underline">Lupa kata sandi?</button>
          </div>
          <button type="submit" class="w-full py-2.5 bg-silaras-dark text-white rounded-xl font-semibold text-sm hover:bg-emerald-800">Masuk</button>
        </form>
      </div>

      <!-- Register Form -->
      <div x-show="authModal.mode === 'register'" class="space-y-4">
        <h3 class="text-xl font-bold text-slate-900">Daftar Akun Baru</h3>
        <form @submit.prevent="submitRegister()" class="space-y-2.5">
          <input type="text" required placeholder="Nama Lengkap & Gelar" x-model="regForm.full_name" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm" />
          <input type="text" required placeholder="NIM / NIP / NIDN" x-model="regForm.nim_nip" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm" />
          <input type="text" required placeholder="Program Studi / Unit" x-model="regForm.unit_prodi" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm" />
          <input type="text" required placeholder="No. WhatsApp" x-model="regForm.phone" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm" />
          <input type="email" required placeholder="Email" x-model="regForm.email" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm" />
          <input type="password" required placeholder="Password" x-model="regForm.password" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm" />
          <button type="submit" class="w-full py-2.5 bg-silaras-dark text-white rounded-xl font-semibold text-sm hover:bg-emerald-800">Daftar Sekarang</button>
        </form>
      </div>

      <!-- Forgot Password Form -->
      <div x-show="authModal.mode === 'forgot'" class="space-y-4">
        <h3 class="text-xl font-bold text-slate-900">Reset Kata Sandi</h3>
        <form x-show="forgotForm.step === 1" @submit.prevent="submitRequestResetOtp()" class="space-y-3">
          <input type="email" required placeholder="Masukkan email terdaftar" x-model="forgotForm.email" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm" />
          <button type="submit" class="w-full py-2.5 bg-silaras-dark text-white rounded-xl font-semibold text-sm">Kirim Kode OTP</button>
        </form>
        <form x-show="forgotForm.step === 2" @submit.prevent="submitConfirmResetPassword()" class="space-y-3">
          <input type="text" required placeholder="Kode OTP 6 Digit" x-model="forgotForm.otp" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm" />
          <input type="password" required placeholder="Kata Sandi Baru" x-model="forgotForm.new_password" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm" />
          <input type="password" required placeholder="Konfirmasi Kata Sandi Baru" x-model="forgotForm.confirm_password" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm" />
          <button type="submit" class="w-full py-2.5 bg-silaras-dark text-white rounded-xl font-semibold text-sm">Simpan Kata Sandi</button>
        </form>
      </div>
    </div>
  </div>

  <!-- ==================== INTERNAL WORKSPACE VIEW ==================== -->
  <template x-if="session">
    <div class="min-h-screen flex bg-slate-100">
      <!-- Sidebar -->
      <aside class="w-64 bg-silaras-dark text-white flex flex-col shrink-0">
        <div class="p-4 border-b border-emerald-800 flex items-center gap-3">
          <img src="https://drive.google.com/thumbnail?id=1LIq-IYBi0L6lXGEMDyrb3jmVjf9yAQRU&sz=w128" class="w-9 h-9 rounded-lg bg-white p-1" />
          <div>
            <div class="font-bold text-sm">SILARAS</div>
            <div class="text-[11px] text-emerald-200" x-text="session.active_role"></div>
          </div>
        </div>
        <nav class="flex-1 p-3 space-y-1 text-sm overflow-y-auto">
          <button @click="navigate('dashboard')" :class="activeMenu === 'dashboard' ? 'bg-emerald-800 text-white' : 'text-emerald-100 hover:bg-emerald-800/60'" class="w-full text-left px-3 py-2 rounded-xl flex items-center gap-2.5"><i class="fa-solid fa-gauge w-4"></i> Dashboard</button>
          <button x-show="canAccess('master_data')" @click="navigate('master_data')" :class="activeMenu === 'master_data' ? 'bg-emerald-800 text-white' : 'text-emerald-100 hover:bg-emerald-800/60'" class="w-full text-left px-3 py-2 rounded-xl flex items-center gap-2.5"><i class="fa-solid fa-database w-4"></i> Master Data</button>
          <button x-show="canAccess('inv_alat')" @click="navigate('inv_alat')" :class="activeMenu === 'inv_alat' ? 'bg-emerald-800 text-white' : 'text-emerald-100 hover:bg-emerald-800/60'" class="w-full text-left px-3 py-2 rounded-xl flex items-center gap-2.5"><i class="fa-solid fa-microscope w-4"></i> Inventaris Alat</button>
          <button x-show="canAccess('alat_rusak')" @click="navigate('alat_rusak')" :class="activeMenu === 'alat_rusak' ? 'bg-emerald-800 text-white' : 'text-emerald-100 hover:bg-emerald-800/60'" class="w-full text-left px-3 py-2 rounded-xl flex items-center gap-2.5"><i class="fa-solid fa-screwdriver-wrench w-4"></i> Alat Rusak</button>
          <button x-show="canAccess('inv_bahan')" @click="navigate('inv_bahan')" :class="activeMenu === 'inv_bahan' ? 'bg-emerald-800 text-white' : 'text-emerald-100 hover:bg-emerald-800/60'" class="w-full text-left px-3 py-2 rounded-xl flex items-center gap-2.5"><i class="fa-solid fa-box-open w-4"></i> Inventaris Bahan</button>
          <button x-show="canAccess('inv_kimia')" @click="navigate('inv_kimia')" :class="activeMenu === 'inv_kimia' ? 'bg-emerald-800 text-white' : 'text-emerald-100 hover:bg-emerald-800/60'" class="w-full text-left px-3 py-2 rounded-xl flex items-center gap-2.5"><i class="fa-solid fa-flask w-4"></i> Bahan Kimia</button>
          <button x-show="canAccess('gudang')" @click="navigate('gudang')" :class="activeMenu === 'gudang' ? 'bg-emerald-800 text-white' : 'text-emerald-100 hover:bg-emerald-800/60'" class="w-full text-left px-3 py-2 rounded-xl flex items-center gap-2.5"><i class="fa-solid fa-warehouse w-4"></i> Gudang Pusat</button>
          <button x-show="canAccess('pinjam_alat')" @click="navigate('pinjam_alat')" :class="activeMenu === 'pinjam_alat' ? 'bg-emerald-800 text-white' : 'text-emerald-100 hover:bg-emerald-800/60'" class="w-full text-left px-3 py-2 rounded-xl flex items-center gap-2.5"><i class="fa-solid fa-hand-holding w-4"></i> Peminjaman Alat</button>
